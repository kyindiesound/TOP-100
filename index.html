<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP-100 — Global Music Charts & Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        canvas: '#fcfcfd',
                        surface: '#f3f3f6',
                        line: '#e4e4e7',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fcfcfd;
            color: #09090b;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }
        .row-hover:hover {
            background-color: rgba(0, 0, 0, 0.025);
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #fcfcfd; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 2px; }
        .transition-smooth {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-black selection:text-white">

    <!-- Header Section -->
    <header class="w-full border-b border-[#e4e4e7] bg-[#fcfcfd]/90 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="flex flex-col">
                    <div class="flex items-center space-x-2">
                        <span class="font-sans font-bold tracking-tight text-base uppercase text-zinc-900">TOP-100</span>
                        <span class="text-zinc-300">/</span>
                        <span class="font-mono text-[11px] text-zinc-500 uppercase tracking-widest">Live Feed</span>
                    </div>
                    <span class="text-[10px] font-mono text-zinc-400 mt-0.5">KY INDIE SOUND Catalog</span>
                </div>
            </div>

            <!-- Global Status -->
            <div class="flex items-center space-x-4">
                <div class="hidden md:flex items-center space-x-2 px-3 py-1.5 rounded-full bg-zinc-100 border border-zinc-200 text-[11px] font-mono text-zinc-600">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="sync-status">API Connected</span>
                </div>
                <button onclick="app.loadData()" class="px-4 py-2 text-xs font-mono bg-zinc-900 text-white rounded hover:bg-zinc-800 transition-smooth flex items-center space-x-2 shadow-sm">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span>[ SYNC ]</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Wrapper -->
    <main class="flex-grow max-w-5xl mx-auto px-6 py-10 w-full">
        
        <!-- Toolbar: Tabs & Search & Limit -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div class="flex items-center space-x-6 border-b border-[#e4e4e7] pb-4 md:border-b-0 md:pb-0 overflow-x-auto w-full md:w-auto" id="platform-tabs">
                <button onclick="app.switchPlatform('youtube')" data-target="youtube" class="text-zinc-900 pb-1 border-b-2 border-zinc-900 text-xs uppercase tracking-widest font-semibold transition-smooth whitespace-nowrap">YouTube KG</button>
                <button onclick="app.switchPlatform('apple_music')" data-target="apple_music" class="text-zinc-400 hover:text-zinc-700 pb-1 border-b-2 border-transparent text-xs uppercase tracking-widest font-semibold transition-smooth whitespace-nowrap">Apple Music</button>
                <button onclick="app.switchPlatform('spotify')" data-target="spotify" class="text-zinc-400 hover:text-zinc-700 pb-1 border-b-2 border-transparent text-xs uppercase tracking-widest font-semibold transition-smooth whitespace-nowrap">Spotify</button>
                <button onclick="app.switchPlatform('shazam')" data-target="shazam" class="text-zinc-400 hover:text-zinc-700 pb-1 border-b-2 border-transparent text-xs uppercase tracking-widest font-semibold transition-smooth whitespace-nowrap">Shazam</button>
            </div>

            <div class="flex items-center space-x-3 w-full md:w-auto">
                <input type="text" id="track-search" placeholder="Search in catalog..." oninput="app.handleSearch(this.value)" class="w-full md:w-64 bg-zinc-100/80 border border-zinc-200 rounded px-3.5 py-2 text-xs text-zinc-900 placeholder-zinc-400 focus:outline-none focus:border-zinc-400 transition-smooth font-sans">
                
                <select id="limit-select" onchange="app.setLimit(this.value)" class="bg-zinc-100/80 border border-zinc-200 rounded px-2.5 py-2 text-xs font-mono text-zinc-700 focus:outline-none">
                    <option value="25">Show 25</option>
                    <option value="10">Show 10</option>
                </select>
            </div>
        </div>

        <!-- Table Header -->
        <div class="bg-zinc-100/60 border border-[#e4e4e7] rounded-t-lg px-4 py-3 grid grid-cols-12 items-center text-[10px] font-mono uppercase tracking-widest text-zinc-500">
            <div class="col-span-1 text-left">#</div>
            <div class="col-span-7 md:col-span-9 pl-2">Track & Artist</div>
            <div class="col-span-4 md:col-span-2 text-right" id="metric-label">Views</div>
        </div>

        <!-- Tracks Container -->
        <div class="border-x border-b border-[#e4e4e7] rounded-b-lg bg-white overflow-hidden shadow-2xl shadow-zinc-200/50 min-h-[400px]">
            <div id="loader" class="py-32 text-center flex flex-col items-center justify-center space-y-3">
                <div class="w-6 h-6 border-2 border-zinc-300 border-t-zinc-900 rounded-full animate-spin"></div>
                <span class="font-mono text-xs text-zinc-400">Loading live data from API...</span>
            </div>

            <div id="tracks-list" class="divide-y divide-[#e4e4e7] hidden"></div>
        </div>

        <!-- Counter Footer -->
        <div class="mt-4 flex items-center justify-between text-xs font-mono text-zinc-500 px-2">
            <span id="total-tracks-count">Showing 0 tracks</span>
            <span>API Source: Live Backend</span>
        </div>
    </main>

    <!-- Modal for Track Details -->
    <div id="track-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white border border-zinc-200 rounded-lg max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-zinc-900 text-xs font-mono">✕</button>
            <div id="modal-content" class="space-y-4"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full border-t border-[#e4e4e7] py-8 mt-auto bg-white">
        <div class="max-w-5xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-xs font-mono text-zinc-500">
            <div class="flex items-center space-x-2">
                <span class="font-bold text-zinc-900">TOP-100</span>
                <span>— Global Music Intelligence</span>
            </div>
            <div class="tracking-wider uppercase text-[11px] text-zinc-400 font-semibold">
                by KY INDIE SOUND
            </div>
        </div>
    </footer>

    <!-- Clean Application Script -->
    <script>
        class MusicChartApp {
            constructor() {
                this.currentPlatform = 'youtube';
                this.searchQuery = '';
                this.limit = 25;
                this.rawData = {};
                this.loadData();
            }

            async loadData() {
                const loader = document.getElementById("loader");
                const listEl = document.getElementById("tracks-list");
                
                loader.style.display = "flex";
                listEl.classList.add("hidden");

                try {
                    // Укажите ваш актуальный URL бэкенда на Render или оставьте относительный путь, если фронт и бэк на одном домене
                    const response = await fetch('https://top1-00-api.onrender.com/api/charts');
                    const result = await response.json();
                    
                    if (result.status === "success") {
                        this.rawData = result.data;
                    }
                } catch (e) {
                    console.error("Failed to load data from API:", e);
                    // Fallback пустые данные, если сервер недоступен
                    this.rawData = { youtube: [], apple_music: [], spotify: [], shazam: [] };
                }

                this.render();
            }

            async switchPlatform(platform) {
                this.currentPlatform = platform;
                
                document.querySelectorAll('#platform-tabs button').forEach(btn => {
                    if (btn.getAttribute('data-target') === platform) {
                        btn.className = "text-zinc-900 pb-1 border-b-2 border-zinc-900 text-xs uppercase tracking-widest font-semibold transition-smooth whitespace-nowrap";
                    } else {
                        btn.className = "text-zinc-400 hover:text-zinc-700 pb-1 border-b-2 border-transparent text-xs uppercase tracking-widest font-semibold transition-smooth whitespace-nowrap";
                    }
                });

                this.render();
            }

            handleSearch(query) {
                this.searchQuery = query.toLowerCase().trim();
                this.render();
            }

            setLimit(val) {
                this.limit = parseInt(val);
                this.render();
            }

            render() {
                const loader = document.getElementById("loader");
                const listEl = document.getElementById("tracks-list");
                const metricLabel = document.getElementById("metric-label");
                const countEl = document.getElementById("total-tracks-count");

                let tracks = this.rawData[this.currentPlatform] || [];

                if (this.searchQuery) {
                    tracks = tracks.filter(t => 
                        t.title.toLowerCase().includes(this.searchQuery) || 
                        t.artist.toLowerCase().includes(this.searchQuery)
                    );
                }

                tracks = tracks.slice(0, this.limit);

                // Динамическая метка столбца показателей
                if (this.currentPlatform === 'youtube') metricLabel.textContent = "Views";
                else if (this.currentPlatform === 'apple_music' || this.currentPlatform === 'spotify') metricLabel.textContent = "Streams";
                else if (this.currentPlatform === 'shazam') metricLabel.textContent = "Searches";

                countEl.textContent = `Showing ${tracks.length} tracks`;

                let html = "";
                if (tracks.length === 0) {
                    html = `<div class="py-20 text-center font-mono text-xs text-zinc-400">No tracks found or API is loading...</div>`;
                } else {
                    tracks.forEach((track, index) => {
                        const valKey = track.streams !== undefined ? track.streams : (track.views !== undefined ? track.views : track.searches);
                        const formattedVal = new Intl.NumberFormat('ru-RU').format(valKey || 0);

                        html += `
                            <div onclick='app.openTrackDetails(${JSON.stringify(track).replace(/'/g, "&#39;")})' class="px-4 py-3 grid grid-cols-12 items-center row-hover transition-smooth cursor-pointer group">
                                <div class="col-span-1 font-mono text-xs text-zinc-400 font-medium">
                                    ${String(index + 1).padStart(2, '0')}
                                </div>
                                <div class="col-span-7 md:col-span-9 flex items-center space-x-3.5 pl-2">
                                    <div class="w-10 h-10 rounded bg-zinc-100 overflow-hidden flex-shrink-0 border border-zinc-200">
                                        <img src="${track.cover || 'https://picsum.photos/200'}" alt="${track.title}" loading="lazy" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-all">
                                    </div>
                                    <div class="min-w-0">
                                        <h4 class="text-xs font-semibold text-zinc-900 tracking-tight truncate group-hover:text-black">${track.title}</h4>
                                        <p class="text-[11px] text-zinc-500 truncate mt-0.5">${track.artist}</p>
                                    </div>
                                </div>
                                <div class="col-span-4 md:col-span-2 text-right">
                                    <span class="font-mono text-xs font-medium text-zinc-700">${formattedVal}</span>
                                </div>
                            </div>
                        `;
                    });
                }

                listEl.innerHTML = html;
                loader.style.display = "none";
                listEl.classList.remove("hidden");
            }

            openTrackDetails(track) {
                const modal = document.getElementById("track-modal");
                const content = document.getElementById("modal-content");
                const valKey = track.streams !== undefined ? track.streams : (track.views !== undefined ? track.views : track.searches);
                
                content.innerHTML = `
                    <div class="flex items-center space-x-4 mb-4">
                        <img src="${track.cover || 'https://picsum.photos/200'}" class="w-16 h-16 rounded object-cover border border-zinc-200">
                        <div>
                            <h3 class="text-sm font-bold text-zinc-900">${track.title}</h3>
                            <p class="text-xs text-zinc-500 mt-0.5">${track.artist}</p>
                            <span class="inline-block mt-2 px-2 py-0.5 rounded bg-zinc-100 text-[10px] font-mono text-zinc-600">Platform: ${this.currentPlatform.toUpperCase()}</span>
                        </div>
                    </div>
                    <div class="border-t border-zinc-100 pt-4 space-y-2 font-mono text-xs">
                        <div class="flex justify-between py-1 border-b border-zinc-50">
                            <span class="text-zinc-400">Total Metric:</span>
                            <span class="text-zinc-900 font-medium">${new Intl.NumberFormat('ru-RU').format(valKey || 0)}</span>
                        </div>
                        <div class="flex justify-between py-1">
                            <span class="text-zinc-400">Label:</span>
                            <span class="text-zinc-900 font-medium">KY INDIE SOUND</span>
                        </div>
                    </div>
                `;
                modal.classList.remove("hidden");
            }

            closeModal() {
                document.getElementById("track-modal").classList.add("hidden");
            }
        }

        const app = new MusicChartApp();
    </script>
</body>
</html>
