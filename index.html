<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KY INDIE SOUND — Charts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        canvas: '#fcfcfd',
                        surface: '#f3f3f6',
                        line: '#e4e4e7',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fcfcfd;
            color: #09090b;
        }
        .row-hover:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #fcfcfd; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-black selection:text-white">

    <!-- Minimal Header -->
    <header class="w-full border-b border-[#e4e4e7] bg-[#fcfcfd]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="font-sans font-semibold tracking-wider text-xs uppercase text-zinc-500">KY INDIE SOUND</span>
                <span class="text-zinc-300">/</span>
                <span class="font-medium text-sm text-zinc-900">Charts</span>
            </div>
            <button onclick="app.fetchData()" class="text-xs font-mono text-zinc-400 hover:text-zinc-900 transition-colors">
                [ sync ]
            </button>
        </div>
    </header>

    <!-- Main Section -->
    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full">
        
        <!-- Platform Switcher (Minimal Tabs) -->
        <div class="flex items-center space-x-8 mb-10 border-b border-[#e4e4e7] pb-4 text-xs uppercase tracking-widest font-medium overflow-x-auto" id="platform-tabs">
            <button onclick="app.switchPlatform('youtube')" data-target="youtube" class="text-zinc-900 pb-4 -mb-4 border-b border-zinc-900 transition-colors whitespace-nowrap">YouTube KG</button>
            <button onclick="app.switchPlatform('apple_music')" data-target="apple_music" class="text-zinc-400 hover:text-zinc-700 transition-colors whitespace-nowrap">Apple Music</button>
            <button onclick="app.switchPlatform('spotify')" data-target="spotify" class="text-zinc-400 hover:text-zinc-700 transition-colors whitespace-nowrap">Spotify</button>
            <button onclick="app.switchPlatform('shazam')" data-target="shazam" class="text-zinc-400 hover:text-zinc-700 transition-colors whitespace-nowrap">Shazam</button>
        </div>

        <!-- List Container -->
        <div>
            <div class="flex items-center justify-between pb-4 text-[10px] font-mono uppercase tracking-widest text-zinc-400 border-b border-[#e4e4e7] px-3">
                <span>Track & Artist</span>
                <span id="metric-label">Streams</span>
            </div>
            
            <div id="loader" class="py-28 text-center font-mono text-xs text-zinc-400">
                Loading database...
            </div>

            <div id="tracks-list" class="divide-y divide-[#e4e4e7] hidden"></div>
        </div>
    </main>

    <!-- Script -->
    <script>
        // Вставьте ваш реальный URL бэкенда на Render без слэша на конце
        const API_BASE_URL = "https://your-backend-service.onrender.com";

        class MusicChartApp {
            constructor() {
                this.data = null;
                this.currentPlatform = 'youtube';
                this.fetchData();
            }

            async fetchData() {
                const loader = document.getElementById("loader");
                const listEl = document.getElementById("tracks-list");
                
                loader.style.display = "block";
                listEl.classList.add("hidden");

                try {
                    const res = await fetch(`${API_BASE_URL}/api/v1/charts`);
                    if (!res.ok) throw new Error("Server error");
                    
                    const json = await res.json();
                    this.data = json.data || json;
                    this.render();
                } catch (err) {
                    console.error(err);
                    loader.innerHTML = `<span class="text-zinc-400">Connection error. Check API_BASE_URL.</span>`;
                }
            }

            switchPlatform(platform) {
                this.currentPlatform = platform;
                
                document.querySelectorAll('#platform-tabs button').forEach(btn => {
                    if (btn.getAttribute('data-target') === platform) {
                        btn.className = "text-zinc-900 pb-4 -mb-4 border-b border-zinc-900 transition-colors whitespace-nowrap";
                    } else {
                        btn.className = "text-zinc-400 hover:text-zinc-700 transition-colors whitespace-nowrap";
                    }
                });

                this.render();
            }

            render() {
                if (!this.data) return;

                const loader = document.getElementById("loader");
                const listEl = document.getElementById("tracks-list");
                const metricLabel = document.getElementById("metric-label");

                let tracks = this.data[this.currentPlatform] || [];

                if (this.currentPlatform === 'youtube') metricLabel.textContent = "Views";
                else if (this.currentPlatform === 'apple_music' || this.currentPlatform === 'spotify') metricLabel.textContent = "Streams";
                else if (this.currentPlatform === 'shazam') metricLabel.textContent = "Searches";

                let html = "";
                if (tracks.length === 0) {
                    html = `<div class="py-16 text-center font-mono text-xs text-zinc-400">No tracks available</div>`;
                } else {
                    tracks.forEach((track, index) => {
                        const rank = index + 1;
                        const val = track.views || track.streams || track.searches || 0;
                        const formattedVal = new Intl.NumberFormat('ru-RU').format(val);
                        const cover = track.cover || "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=120&auto=format&fit=crop&q=80";

                        html += `
                            <div class="px-3 py-3.5 flex items-center justify-between row-hover transition-colors group">
                                <div class="flex items-center space-x-4">
                                    <span class="font-mono text-xs text-zinc-400 w-6">${String(rank).padStart(2, '0')}</span>
                                    <div class="w-9 h-9 rounded bg-zinc-200 overflow-hidden flex-shrink-0">
                                        <img src="${cover}" alt="${track.title}" class="w-full h-full object-cover grayscale opacity-90 group-hover:grayscale-0 group-hover:opacity-100 transition-all">
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-medium text-zinc-900 tracking-wide">${track.title}</h4>
                                        <p class="text-[11px] text-zinc-500">${track.artist}</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="font-mono text-xs text-zinc-600">${formattedVal}</span>
                                </div>
                            </div>
                        `;
                    });
                }

                listEl.innerHTML = html;
                loader.style.display = "none";
                listEl.classList.remove("hidden");
            }
        }

        const app = new MusicChartApp();
    </script>
</body>
</html>
