<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP-100 — Global Music Charts & Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        canvas: '#fcfcfd',
                        surface: '#f3f3f6',
                        line: '#e4e4e7',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fcfcfd;
            color: #09090b;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }
        .row-hover:hover {
            background-color: rgba(0, 0, 0, 0.025);
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #fcfcfd; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 2px; }
        .transition-smooth {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-black selection:text-white">

    <!-- Header Section -->
    <header class="w-full border-b border-[#e4e4e7] bg-[#fcfcfd]/90 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="flex flex-col">
                    <div class="flex items-center space-x-2">
                        <span class="font-sans font-bold tracking-tight text-base uppercase text-zinc-900">TOP-100</span>
                        <span class="text-zinc-300">/</span>
                        <span class="font-mono text-[11px] text-zinc-500 uppercase tracking-widest">Live Feed</span>
                    </div>
                    <span class="text-[10px] font-mono text-zinc-400 mt-0.5">Automated Platform Covers Sync</span>
                </div>
            </div>

            <!-- Global Status -->
            <div class="flex items-center space-x-4">
                <div class="hidden md:flex items-center space-x-2 px-3 py-1.5 rounded-full bg-zinc-100 border border-zinc-200 text-[11px] font-mono text-zinc-600">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="sync-status">100 Tracks Loaded</span>
                </div>
                <button onclick="app.refreshCovers()" class="px-4 py-2 text-xs font-mono bg-zinc-900 text-white rounded hover:bg-zinc-800 transition-smooth flex items-center space-x-2 shadow-sm">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span>[ REFRESH ]</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Wrapper -->
    <main class="flex-grow max-w-5xl mx-auto px-6 py-10 w-full">
        
        <!-- Toolbar: Tabs & Search & Limit -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div class="flex items-center space-x-6 border-b border-[#e4e4e7] pb-4 md:border-b-0 md:pb-0 overflow-x-auto w-full md:w-auto" id="platform-tabs">
                <button onclick="app.switchPlatform('youtube')" data-target="youtube" class="text-zinc-900 pb-1 border-b-2 border-zinc-900 text-xs uppercase tracking-widest font-semibold transition-smooth whitespace-nowrap">YouTube KG</button>
                <button onclick="app.switchPlatform('apple_music')" data-target="apple_music" class="text-zinc-400 hover:text-zinc-700 pb-1 border-b-2 border-transparent text-xs uppercase tracking-widest font-semibold transition-smooth whitespace-nowrap">Apple Music</button>
                <button onclick="app.switchPlatform('spotify')" data-target="spotify" class="text-zinc-400 hover:text-zinc-700 pb-1 border-b-2 border-transparent text-xs uppercase tracking-widest font-semibold transition-smooth whitespace-nowrap">Spotify</button>
                <button onclick="app.switchPlatform('shazam')" data-target="shazam" class="text-zinc-400 hover:text-zinc-700 pb-1 border-b-2 border-transparent text-xs uppercase tracking-widest font-semibold transition-smooth whitespace-nowrap">Shazam</button>
            </div>

            <div class="flex items-center space-x-3 w-full md:w-auto">
                <input type="text" id="track-search" placeholder="Search in TOP-100..." oninput="app.handleSearch(this.value)" class="w-full md:w-64 bg-zinc-100/80 border border-zinc-200 rounded px-3.5 py-2 text-xs text-zinc-900 placeholder-zinc-400 focus:outline-none focus:border-zinc-400 transition-smooth font-sans">
                
                <select id="limit-select" onchange="app.setLimit(this.value)" class="bg-zinc-100/80 border border-zinc-200 rounded px-2.5 py-2 text-xs font-mono text-zinc-700 focus:outline-none">
                    <option value="100">Top 100</option>
                    <option value="50">Top 50</option>
                    <option value="20">Top 20</option>
                </select>
            </div>
        </div>

        <!-- Table Header -->
        <div class="bg-zinc-100/60 border border-[#e4e4e7] rounded-t-lg px-4 py-3 grid grid-cols-12 items-center text-[10px] font-mono uppercase tracking-widest text-zinc-500">
            <div class="col-span-1 text-left">#</div>
            <div class="col-span-7 md:col-span-8 pl-2">Track & Artist</div>
            <div class="col-span-2 text-center hidden md:block">Trend</div>
            <div class="col-span-4 md:col-span-1 text-right" id="metric-label">Views</div>
        </div>

        <!-- Tracks Container -->
        <div class="border-x border-b border-[#e4e4e7] rounded-b-lg bg-white overflow-hidden shadow-2xl shadow-zinc-200/50 min-h-[500px]">
            <div id="loader" class="py-32 text-center flex flex-col items-center justify-center space-y-3">
                <div class="w-6 h-6 border-2 border-zinc-300 border-t-zinc-900 rounded-full animate-spin"></div>
                <span class="font-mono text-xs text-zinc-400">Fetching covers & chart data...</span>
            </div>

            <div id="tracks-list" class="divide-y divide-[#e4e4e7] hidden"></div>
        </div>

        <!-- Counter Footer -->
        <div class="mt-4 flex items-center justify-between text-xs font-mono text-zinc-500 px-2">
            <span id="total-tracks-count">Showing 100 of 100 tracks</span>
            <span>API Auto-Sync: Enabled</span>
        </div>
    </main>

    <!-- Modal for Track Details -->
    <div id="track-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white border border-zinc-200 rounded-lg max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-zinc-900 text-xs font-mono">✕</button>
            <div id="modal-content" class="space-y-4"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full border-t border-[#e4e4e7] py-8 mt-auto bg-white">
        <div class="max-w-5xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-xs font-mono text-zinc-500">
            <div class="flex items-center space-x-2">
                <span class="font-bold text-zinc-900">TOP-100</span>
                <span>— Global Music Intelligence</span>
            </div>
            <div class="tracking-wider uppercase text-[11px] text-zinc-400 font-semibold">
                by KY INDIE SOUND
            </div>
        </div>
    </footer>

    <!-- Logic & Dynamic 100 Track Generator with Real Covers -->
    <script>
        // База артистов и названий для генерации релевантного TOP-100
        const ARTISTS = [
            "BACO", "OVO", "MuzToo", "Indie Project KG", "Saz Records", "Noname", 
            "Ulukmanapo", "FREEMAN 996", "Jax 02.14", "Mirbek Atabekov", "JANY",
            "Ysyk-Köl Waves", "KY INDIE Collective", "Nurbek Savitakhunov", "Zere", 
            "Cholpon", "Begish", "Bayastan", "Ormon", "Tynai", "Aida", "Akyl"
        ];

        const TRACK_TITLES = [
            "Сагынам", "Тун ичинде", "Kyzyl-Kiya", "Эсимде", "Jyldyz", "Tamchy",
            "Bishkek Nights", "Ala-Archa", "Koyon", "Salkyn", "Jol", "Janym",
            "Suluu", "Jalgyz", "Umut", "Arnamys", "Muras", "Kesh", "Ay-Danek",
            "Cholpon-Ata", "Khan-Tengri", "Tuman", "Jangy Kun", "Koy-Tash", "Tilek"
        ];

        class MusicChartEngine {
            constructor() {
                this.currentPlatform = 'youtube';
                this.searchQuery = '';
                this.limit = 100;
                this.database = {};
                this.coverCache = {};
                this.generateFullDatabase();
                this.init();
            }

            // Генератор полных 100 треков для каждой площадки
            generateFullDatabase() {
                const platforms = ['youtube', 'apple_music', 'spotify', 'shazam'];
                
                platforms.forEach(p => {
                    this.database[p] = [];
                    let baseValue = p === 'youtube' ? 2500000 : p === 'shazam' ? 85000 : 950000;

                    for (let i = 1; i <= 100; i++) {
                        const artist = ARTISTS[(i * 7 + p.length) % ARTISTS.length];
                        const title = TRACK_TITLES[(i * 3 + p.length) % TRACK_TITLES.length] + (i > 25 ? ` (Pt. ${(i%3)+1})` : '');
                        const val = Math.floor(baseValue * (1 - (i * 0.0085)) + Math.random() * 5000);
                        
                        // Тренд: Рост / Падение / Новый
                        let trend = '=';
                        if (i % 7 === 0) trend = 'NEW';
                        else if (i % 3 === 0) trend = `+${(i % 5) + 1}`;
                        else if (i % 4 === 0) trend = `-${(i % 3) + 1}`;

                        this.database[p].push({
                            id: `${p}-${i}`,
                            rank: i,
                            title: title,
                            artist: artist,
                            val: val,
                            trend: trend,
                            cover: null // Будет получено динамически
                        });
                    }
                });
            }

            async init() {
                await this.fetchCoversForPlatform(this.currentPlatform);
                this.render();
            }

            // Динамическая загрузка обложек с музыкальных сервисов (через iTunes/Apple Search API)
            async fetchCoversForPlatform(platform) {
                const tracks = this.database[platform];
                
                // Берем первые 30 треков для ускорения загрузки настоящих обложек
                const batch = tracks.slice(0, 30);
                
                const promises = batch.map(async (track) => {
                    if (track.cover) return;

                    const cacheKey = `${track.artist}-${track.title}`;
                    if (this.coverCache[cacheKey]) {
                        track.cover = this.coverCache[cacheKey];
                        return;
                    }

                    try {
                        const query = encodeURIComponent(`${track.artist} ${track.title}`);
                        const response = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                        const data = await response.json();

                        if (data.results && data.results.length > 0) {
                            // Берем оригинальную обложку высокого разрешения
                            const coverUrl = data.results[0].artworkUrl100.replace('100x100bb', '300x300bb');
                            track.cover = coverUrl;
                            this.coverCache[cacheKey] = coverUrl;
                        } else {
                            // Fallback на динамический стильный пак виниловых обложек
                            track.cover = `https://picsum.photos/seed/${encodeURIComponent(track.artist + track.title)}/200`;
                        }
                    } catch (e) {
                        track.cover = `https://picsum.photos/seed/${encodeURIComponent(track.artist + track.title)}/200`;
                    }
                });

                await Promise.all(promises);

                // Заполняем остальные треки надежными уникальными обложками
                tracks.forEach(track => {
                    if (!track.cover) {
                        track.cover = `https://picsum.photos/seed/${encodeURIComponent(track.artist + track.title)}/200`;
                    }
                });
            }

            async switchPlatform(platform) {
                this.currentPlatform = platform;
                
                document.querySelectorAll('#platform-tabs button').forEach(btn => {
                    if (btn.getAttribute('data-target') === platform) {
                        btn.className = "text-zinc-900 pb-1 border-b-2 border-zinc-900 text-xs uppercase tracking-widest font-semibold transition-smooth whitespace-nowrap";
                    } else {
                        btn.className = "text-zinc-400 hover:text-zinc-700 pb-1 border-b-2 border-transparent text-xs uppercase tracking-widest font-semibold transition-smooth whitespace-nowrap";
                    }
                });

                document.getElementById("loader").style.display = "flex";
                document.getElementById("tracks-list").classList.add("hidden");

                await this.fetchCoversForPlatform(platform);
                this.render();
            }

            handleSearch(query) {
                this.searchQuery = query.toLowerCase().trim();
                this.render();
            }

            setLimit(val) {
                this.limit = parseInt(val);
                this.render();
            }

            async refreshCovers() {
                this.coverCache = {};
                this.database[this.currentPlatform].forEach(t => t.cover = null);
                document.getElementById("loader").style.display = "flex";
                document.getElementById("tracks-list").classList.add("hidden");
                await this.fetchCoversForPlatform(this.currentPlatform);
                this.render();
            }

            render() {
                const loader = document.getElementById("loader");
                const listEl = document.getElementById("tracks-list");
                const metricLabel = document.getElementById("metric-label");
                const countEl = document.getElementById("total-tracks-count");

                let tracks = this.database[this.currentPlatform] || [];

                if (this.searchQuery) {
                    tracks = tracks.filter(t => 
                        t.title.toLowerCase().includes(this.searchQuery) || 
                        t.artist.toLowerCase().includes(this.searchQuery)
                    );
                }

                tracks = tracks.slice(0, this.limit);

                if (this.currentPlatform === 'youtube') metricLabel.textContent = "Views";
                else if (this.currentPlatform === 'apple_music' || this.currentPlatform === 'spotify') metricLabel.textContent = "Streams";
                else if (this.currentPlatform === 'shazam') metricLabel.textContent = "Searches";

                countEl.textContent = `Showing ${tracks.length} of 100 tracks`;

                let html = "";
                if (tracks.length === 0) {
                    html = `<div class="py-20 text-center font-mono text-xs text-zinc-400">No tracks found matching your query</div>`;
                } else {
                    tracks.forEach((track) => {
                        const formattedVal = new Intl.NumberFormat('ru-RU').format(track.val);
                        const trendColor = track.trend.includes('+') ? 'text-emerald-600 font-mono text-[11px]' : track.trend === 'NEW' ? 'text-blue-600 font-mono text-[11px]' : track.trend.includes('-') ? 'text-rose-500 font-mono text-[11px]' : 'text-zinc-300 font-mono text-[11px]';

                        html += `
                            <div onclick='app.openTrackDetails(${JSON.stringify(track).replace(/'/g, "&#39;")})' class="px-4 py-3 grid grid-cols-12 items-center row-hover transition-smooth cursor-pointer group">
                                <div class="col-span-1 font-mono text-xs text-zinc-400 font-medium">
                                    ${String(track.rank).padStart(2, '0')}
                                </div>
                                <div class="col-span-7 md:col-span-8 flex items-center space-x-3.5 pl-2">
                                    <div class="w-10 h-10 rounded bg-zinc-100 overflow-hidden flex-shrink-0 border border-zinc-200">
                                        <img src="${track.cover}" alt="${track.title}" loading="lazy" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-all">
                                    </div>
                                    <div class="min-w-0">
                                        <h4 class="text-xs font-semibold text-zinc-900 tracking-tight truncate group-hover:text-black">${track.title}</h4>
                                        <p class="text-[11px] text-zinc-500 truncate mt-0.5">${track.artist}</p>
                                    </div>
                                </div>
                                <div class="col-span-2 text-center hidden md:block">
                                    <span class="${trendColor}">${track.trend}</span>
                                </div>
                                <div class="col-span-4 md:col-span-1 text-right">
                                    <span class="font-mono text-xs font-medium text-zinc-700">${formattedVal}</span>
                                </div>
                            </div>
                        `;
                    });
                }

                listEl.innerHTML = html;
                loader.style.display = "none";
                listEl.classList.remove("hidden");
            }

            openTrackDetails(track) {
                const modal = document.getElementById("track-modal");
                const content = document.getElementById("modal-content");
                
                content.innerHTML = `
                    <div class="flex items-center space-x-4 mb-4">
                        <img src="${track.cover}" class="w-16 h-16 rounded object-cover border border-zinc-200">
                        <div>
                            <h3 class="text-sm font-bold text-zinc-900">${track.title}</h3>
                            <p class="text-xs text-zinc-500 mt-0.5">${track.artist}</p>
                            <span class="inline-block mt-2 px-2 py-0.5 rounded bg-zinc-100 text-[10px] font-mono text-zinc-600">Chart Rank: #${track.rank}</span>
                        </div>
                    </div>
                    <div class="border-t border-zinc-100 pt-4 space-y-2 font-mono text-xs">
                        <div class="flex justify-between py-1 border-b border-zinc-50">
                            <span class="text-zinc-400">Platform Performance:</span>
                            <span class="text-zinc-900 font-medium">${new Intl.NumberFormat('ru-RU').format(track.val)}</span>
                        </div>
                        <div class="flex justify-between py-1 border-b border-zinc-50">
                            <span class="text-zinc-400">ISRC Code:</span>
                            <span class="text-zinc-900 font-medium">KG-KY1-26-${String(track.rank).padStart(4, '0')}</span>
                        </div>
                        <div class="flex justify-between py-1">
                            <span class="text-zinc-400">Distribution:</span>
                            <span class="text-zinc-900 font-medium">KY INDIE SOUND</span>
                        </div>
                    </div>
                `;
                modal.classList.remove("hidden");
            }

            closeModal() {
                document.getElementById("track-modal").classList.add("hidden");
            }
        }

        const app = new MusicChartEngine();
    </script>
</body>
</html>
