<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP-100 KG — Minimal Charts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        bgDark: '#0a0a0c',
                        cardBg: '#121216',
                        borderSubtle: '#1f1f26',
                        accent: '#ffffff',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0a0a0c;
            color: #ededed;
        }
        .minimal-border {
            border-bottom: 1px solid #1f1f26;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #272730; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-white selection:text-black">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-[#0a0a0c]/80 backdrop-blur-md minimal-border">
        <div class="max-w-5xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="font-bold tracking-wider text-lg text-white">TOP-100 KG</span>
            </div>
            <button onclick="app.fetchData()" class="text-xs uppercase tracking-widest text-zinc-400 hover:text-white transition-colors">
                Обновить
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto px-6 py-10 w-full">
        
        <!-- Platform Switcher (Minimal) -->
        <div class="flex items-center gap-6 mb-10 overflow-x-auto pb-2 text-sm font-medium" id="platform-tabs">
            <button onclick="app.switchPlatform('youtube')" data-target="youtube" class="text-white border-b-2 border-white pb-1 transition-all">YouTube KG</button>
            <button onclick="app.switchPlatform('apple_music')" data-target="apple_music" class="text-zinc-500 hover:text-zinc-300 pb-1 transition-all">Apple Music</button>
            <button onclick="app.switchPlatform('spotify')" data-target="spotify" class="text-zinc-500 hover:text-zinc-300 pb-1 transition-all">Spotify</button>
            <button onclick="app.switchPlatform('shazam')" data-target="shazam" class="text-zinc-500 hover:text-zinc-300 pb-1 transition-all">Shazam</button>
        </div>

        <!-- Chart List Container -->
        <div class="bg-cardBg rounded-2xl border border-borderSubtle overflow-hidden">
            <div class="px-6 py-4 minimal-border flex items-center justify-between text-[11px] uppercase tracking-widest text-zinc-500">
                <span>Трек</span>
                <span id="metric-label">Показатель</span>
            </div>
            
            <div id="loader" class="py-24 flex flex-col items-center justify-center space-y-3">
                <div class="w-6 h-6 rounded-full border-2 border-zinc-600 border-t-white animate-spin"></div>
                <p class="text-xs text-zinc-500 tracking-wide">Загрузка...</p>
            </div>

            <div id="tracks-list" class="divide-y divide-[#1f1f26] hidden"></div>
        </div>
    </main>

    <!-- Script -->
    <script>
        // ВНИМАНИЕ: Замените эту ссылку на точный URL вашего бэкенда на Render без слэша на конце!
        const API_BASE_URL = "https://your-backend-service.onrender.com";

        class MusicChartApp {
            constructor() {
                this.data = null;
                this.currentPlatform = 'youtube';
                this.fetchData();
            }

            async fetchData() {
                const loader = document.getElementById("loader");
                const listEl = document.getElementById("tracks-list");
                
                loader.style.display = "flex";
                listEl.classList.add("hidden");

                try {
                    const res = await fetch(`${API_BASE_URL}/api/v1/charts`);
                    if (!res.ok) throw new Error("Ошибка связи с сервером");
                    
                    const json = await res.json();
                    this.data = json.data || json;
                    this.render();
                } catch (err) {
                    console.error(err);
                    loader.innerHTML = `
                        <div class="text-center py-10 px-4">
                            <p class="text-zinc-400 text-xs font-medium mb-1">Не удалось загрузить данные с бэкенда.</p>
                            <p class="text-[11px] text-zinc-600">Проверьте ссылку API_BASE_URL в коде.</p>
                        </div>
                    `;
                }
            }

            switchPlatform(platform) {
                this.currentPlatform = platform;
                
                document.querySelectorAll('#platform-tabs button').forEach(btn => {
                    if (btn.getAttribute('data-target') === platform) {
                        btn.className = "text-white border-b-2 border-white pb-1 transition-all";
                    } else {
                        btn.className = "text-zinc-500 hover:text-zinc-300 pb-1 transition-all";
                    }
                });

                this.render();
            }

            render() {
                if (!this.data) return;

                const loader = document.getElementById("loader");
                const listEl = document.getElementById("tracks-list");
                const metricLabel = document.getElementById("metric-label");

                let tracks = this.data[this.currentPlatform] || [];

                if (this.currentPlatform === 'youtube') metricLabel.textContent = "Просмотры";
                else if (this.currentPlatform === 'apple_music' || this.currentPlatform === 'spotify') metricLabel.textContent = "Стримы";
                else if (this.currentPlatform === 'shazam') metricLabel.textContent = "Поиски";

                let html = "";
                if (tracks.length === 0) {
                    html = `<div class="py-16 text-center text-zinc-600 text-xs">Нет данных</div>`;
                } else {
                    tracks.forEach((track, index) => {
                        const rank = index + 1;
                        const val = track.views || track.streams || track.searches || 0;
                        const formattedVal = new Intl.NumberFormat('ru-RU').format(val);
                        const cover = track.cover || "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=120&auto=format&fit=crop&q=80";

                        html += `
                            <div class="px-6 py-3.5 flex items-center justify-between hover:bg-[#18181f] transition-colors">
                                <div class="flex items-center space-x-4">
                                    <span class="text-xs font-mono text-zinc-500 w-6 text-right">${rank}</span>
                                    <div class="w-10 h-10 rounded-lg overflow-hidden bg-zinc-800 flex-shrink-0">
                                        <img src="${cover}" alt="${track.title}" class="w-full h-full object-cover">
                                    </div>
                                    <div>
                                        <h4 class="text-sm font-medium text-white">${track.title}</h4>
                                        <p class="text-xs text-zinc-400">${track.artist}</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs font-mono font-medium text-zinc-300">${formattedVal}</span>
                                </div>
                            </div>
                        `;
                    });
                }

                listEl.innerHTML = html;
                loader.style.display = "none";
                listEl.classList.remove("hidden");
            }
        }

        const app = new MusicChartApp();
    </script>
</body>
</html>
